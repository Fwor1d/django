{% extends 'blog/base.html' %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}<div class="auth-card card mx-auto"><div class="card-body p-4">
<h1 class="h3">Восстановление пароля</h1><p>Введите адрес email, указанный при регистрации.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Получить ссылку</button></form>
<p class="small text-muted mt-3">В учебной версии письмо выводится в терминал сервера, а не отправляется на почту.</p>
</div></div>{% endblock %}
