{% extends 'blog/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-card card mx-auto"><div class="card-body p-4">
  <h1 class="h3">Вход</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="mt-3 mb-1"><a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
  <p>Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a>.</p>
</div></div>
{% endblock %}
