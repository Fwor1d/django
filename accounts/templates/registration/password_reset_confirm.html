{% extends 'blog/base.html' %}
{% block title %}Новый пароль{% endblock %}
{% block content %}<div class="auth-card card mx-auto"><div class="card-body p-4">
{% if validlink %}
<h1 class="h3">Установить новый пароль</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Сохранить пароль</button></form>
{% else %}
<h1 class="h3">Ссылка недействительна</h1><p>Запросите новую ссылку для сброса пароля.</p>
<a href="{% url 'password_reset' %}">Запросить снова</a>
{% endif %}
</div></div>{% endblock %}
