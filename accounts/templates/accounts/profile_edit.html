{% extends 'blog/base.html' %}
{% block title %}Редактирование профиля{% endblock %}
{% block content %}
<div class="card"><div class="card-body p-4">
  <h1 class="h3">Редактировать профиль</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="mb-4"><legend class="h5">Личные данные</legend>{{ u_form.as_p }}</fieldset>
    <fieldset class="mb-4"><legend class="h5">Профиль и аватар</legend>{{ p_form.as_p }}</fieldset>
    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    <a class="btn btn-link" href="{% url 'profile' %}">Отмена</a>
  </form>
</div></div>
{% endblock %}
