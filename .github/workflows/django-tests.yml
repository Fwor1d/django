name: Django tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create local development secret
        run: python -c "from pathlib import Path; from django.core.management.utils import get_random_secret_key; Path('.django-secret-key').write_text(get_random_secret_key())"
      - name: Validate Django configuration
        run: python manage.py check
      - name: Run application tests
        run: python manage.py test blog accounts
